[project]
name = "as5601"
version = "0.0.0"
description = "User-space I2C driver for the AMS AS5601 magnetic rotary position sensor"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["smbus2>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/as5601"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
python_files = "*.spec.py"
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
